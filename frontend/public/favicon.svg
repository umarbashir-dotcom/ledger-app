<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#0F172A"/>

  <!-- Open ledger book -->
  <g>
    <!-- Left page -->
    <path d="M6 9.5c0-.9.73-1.5 1.6-1.35L15 9.4v14.6l-7.6-1.2A1.5 1.5 0 0 1 6 21.3V9.5z" fill="#34D399"/>
    <!-- Right page -->
    <path d="M26 9.5c0-.9-.73-1.5-1.6-1.35L17 9.4v14.6l7.6-1.2A1.5 1.5 0 0 0 26 21.3V9.5z" fill="#10B981"/>
    <!-- Spine -->
    <rect x="15" y="9" width="2" height="15" fill="#065F46"/>

    <!-- Ledger lines: left page -->
    <line x1="8.3" y1="12.2" x2="12.8" y2="12.8" stroke="#064E3B" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="8.3" y1="15.2" x2="12.8" y2="15.6" stroke="#064E3B" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="8.3" y1="18.2" x2="12.8" y2="18.4" stroke="#064E3B" stroke-width="0.9" stroke-linecap="round"/>

    <!-- Ledger lines: right page -->
    <line x1="19.2" y1="12.8" x2="23.7" y2="12.2" stroke="#065F46" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="19.2" y1="15.6" x2="23.7" y2="15.2" stroke="#065F46" stroke-width="0.9" stroke-linecap="round"/>
    <line x1="19.2" y1="18.4" x2="23.7" y2="18.2" stroke="#065F46" stroke-width="0.9" stroke-linecap="round"/>
  </g>
</svg>
